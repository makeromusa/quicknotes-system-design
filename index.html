<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>QuickNotes</h1>
        
        <!-- Status Message Element -->
        <p id="status">Ready.</p>

        <!-- Load Notes Button -->
        <div class="controls">
            <button id="load-btn">Load notes</button>
        </div>

        <hr>

        <!-- Create Note Form -->
        <form id="note-form">
            <div class="form-group">
                <label for="title-input">Title (required, max 100 characters):</label>
                <input type="text" id="title-input" maxlength="100" required>
            </div>
            <div class="form-group">
                <label for="body-input">Body (optional):</label>
                <textarea id="body-input" rows="4"></textarea>
            </div>
            <button type="submit" id="submit-btn">Create Note</button>
        </form>

        <!-- Notes List -->
        <ul id="notes-list"></ul>
    </div>
</body>
</html>
